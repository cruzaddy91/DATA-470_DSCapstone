    are exported from matplotlib/seaborn from versioned CSV/JSON. PosterCraft is used
    for the full-poster aesthetic; prompts should paste verbatim metrics from POSTERCRAFT_POSTER_INPUT.yaml
    (generated with this manifest). Composite the listed PNG paths into the layout—do
    not ask diffusion to redraw plots or numeric labels. This manifest remains the
    source of truth for file paths and hashes.
