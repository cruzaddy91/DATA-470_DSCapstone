<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DATA-470 — Mermaid diagram preview</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; background: #f5f5f5; color: #212121; }
    h1 { font-size: 1.35rem; color: #112467; border-bottom: 3px solid #112467; padding-bottom: 10px; }
    p.note { max-width: 56rem; line-height: 1.5; margin: 12px 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    figure { margin: 0; background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #ebebeb; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    figcaption { font-size: 0.95rem; margin-top: 12px; color: #444; line-height: 1.4; }
    img { width: 100%; height: auto; display: block; }
    .meta { font-size: 0.88rem; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>DATA-470 — Mermaid diagrams (governed pipeline layout)</h1>
  <p class="note">
    Figures use consistent <strong>classDef</strong> roles (storage, pipeline, process, reporting) and
    <strong>subgraph</strong> grouping for layer clarity. Conventions are documented in
    <code>DIAGRAM_STYLE_REFERENCE.md</code>.
  </p>
  <div class="grid">
    <figure>
      <img src="01_data_and_features.png" alt="Data and features" />
      <figcaption><strong>01 — Data &amp; feature contract</strong><br /><span class="meta">Sources → integrate → grain → order-time features → leakage guard</span></figcaption>
    </figure>
    <figure>
      <img src="02_validation_and_models.png" alt="Validation and models" />
      <figcaption><strong>02 — Validation &amp; models</strong><br /><span class="meta">Temporal &amp; grouped splits → estimators → metrics</span></figcaption>
    </figure>
    <figure>
      <img src="03_table_change_flow.png" alt="Table change flow" />
      <figcaption><strong>03 — Table / DDL change flow</strong><br /><span class="meta">Design → review → DEV → validate → approve → PROD execute → smoke checks</span></figcaption>
    </figure>
  </div>
</body>
</html>
