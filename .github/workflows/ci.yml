name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v2.txt
          # PINNED. Unpinned linters break builds with no commit behind them:
          # operational-health-dashboards passed in April 2026 and failed in
          # August on identical code because a newer ruff changed its defaults.
          pip install "ruff==0.16.4" "pytest==9.1.1"

      - name: Lint (ruff)
        # The `|| true` here meant this step could never fail, which is worse
        # than having no lint step at all. Rule set is now chosen explicitly in
        # ruff.toml rather than inherited from whatever ruff defaults to.
        run: ruff check src scripts tests

      - name: Validate (compileall)
        run: make validate

      - name: Test (pytest)
        # No `|| [ $? -eq 5 ]` escape. Exit 5 means pytest collected no tests at
        # all. This repo has four test files with 70 assertions; if collection
        # ever returns nothing, that is a failure worth hearing about.
        run: pytest -q
